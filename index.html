<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Soon - Yagyu Chan</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a0202;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }
        .logo {
            display: inline-block;
        }
        .logo img {
            height: 70px; /* Increased size of the image-based logo */
            width: auto;
        }
        main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 10px 20px;
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
        }
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            color: #ff4d4d;
            letter-spacing: 2px;
        }
        .jp-title {
            font-size: 1.4rem;
            color: #ff8080;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        p {
            color: #b0b0b0;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }
        .jp-desc {
            color: #888888;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .countdown {
            display: flex;
            gap: 15px;
            background: rgba(30, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #5a0000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .time-box {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
        }
        .time-box span {
            display: block;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
        }
        .maint-img {
            max-height: 350px;
            width: auto;
            border-radius: 8px;
            flex-shrink: 0;
        }
        footer {
            width: 100%;
            padding: 20px;
            font-size: 0.875rem;
            color: #888;
            border-top: 1px solid #3a0000;
            background-color: rgba(18, 3, 3, 0.9);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><img src="Yagyu Chan.png" alt="Yagyu Chan Logo"></a>
    </header>

    <main>
        <img src="yagyu maint.png" alt="Left Character" class="maint-img">

        <div class="center-content">
            <h1>COMING SOON</h1>
            <div class="jp-title">近日公開</div>
            
            <p>We are working hard behind the scenes. Stay tuned for the grand opening!</p>
            <div class="jp-desc">裏で鋭意制作中です。オープンをお楽しみに！</div>

            <div class="countdown" id="countdown">
                <div class="time-box"><span id="days">00</span>Days</div>
                <div class="time-box"><span id="hours">00</span>Hours</div>
                <div class="time-box"><span id="minutes">00</span>Minutes</div>
                <div class="time-box"><span id="seconds">00</span>Seconds</div>
            </div>
        </div>

        <img src="momo maint.png" alt="Right Character" class="maint-img">
    </main>

    <footer>
        <p>&copy; 2026 Yagyu Chan & Yagyu Chan Games</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Target: August 27, 2026 at 16:00:00 UTC
            const launchDate = Date.UTC(2026, 7, 27, 15, 0, 0);

            function updateCountdown() {
                const now = Date.now();
                const distance = launchDate - now;

                if (distance < 0) {
                    clearInterval(timer);
                    document.getElementById("countdown").innerHTML = "<h2>We are live!</h2>";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = String(days).padStart(2, '0');
                document.getElementById("hours").innerText = String(hours).padStart(2, '0');
                document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
                document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
            }

            updateCountdown();
            const timer = setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
