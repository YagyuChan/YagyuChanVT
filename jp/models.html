<div id="characterModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle"></h2>
        
        <div class="gallery-container">
            <img id="outfitDisplay" src="" alt="Outfit">
        </div>
        
        <p id="outfitName" style="text-align: center; font-weight: bold;"></p>
        
        <div class="modal-nav">
            <button id="prevBtn">前へ</button>
            <button id="nextBtn">次へ</button>
        </div>
    </div>
</div>

<script>
    const allModels = {
        yagyuu: [
            { name: "デフォルトの衣装", src: "../models/yagyuu/yagyuu_default.png" },
			{ name: "ゴスコーデ", src: "../models/yagyuu/yagyuu_goth.png" },
			{ name: "バニーコーデ", src: "../models/yagyuu/yagyuu_bunny.png" },
			{ name: "ゴシックメイドコーデ", src: "../models/yagyuu/yagyuu_gothmaid.png" },
			{ name: "ゴールデンセレブレーションコーデ", src: "../models/yagyuu/yagyuu_golden.png" },
        ],
        momo: [
            { name: "デフォルトの衣装", src: "../models/momo/momo_default.png" },
			{ name: "ヴァンパイアコーデ", src: "../models/momo/momo_vamp.png" },
			{ name: "ルナメイ風コーデ", src: "../models/momo/momo_ny.png" },
			{ name: "イースターカジュアルコーデ", src: "../models/momo/momo_ec.png" },
        ],
        rin: [
            { name: "デフォルトの衣装", src: "../models/rin/rin_default.png" },
			{ name: "シルフフェアリー衣装", src: "../models/rin/rin_sylphfairy.png" },
			{ name: "SMUG 4CE コーデ", src: "../models/rin/rin_smugforce.png" },
        ],
        killjoy: [
            { name: "デフォルトの衣装", src: "../models/killjoy/killjoy_default.png" },
			{ name: "ゴスコーデ", src: "../models/killjoy/killjoy_goth.png" },
        ],
        hibari: [
            { name: "デフォルトの衣装", src: "../models/hibari/hibari_default.png" },
			{ name: "浴衣さくらコーデ", src: "../models/hibari/hibari_yukata.png" },
			{ name: "サマーコーデ", src: "../models/hibari/hibari_summer.png" },
			{ name: "スウィートトゥースウィッチコーデ", src: "../models/hibari/hibari_witch.png" },
        ],
        linessa: [
            { name: "デフォルトの衣装", src: "../models/linessa/linessa_default.png" },
        ],
		raia: [
            { name: "デフォルトの衣装", src: "../models/raia/raia_default.png" },
        ]
    };

    let currentOutfitData = [];
    let currentIndex = 0;
    const modal = document.getElementById("characterModal");
    const outfitImg = document.getElementById("outfitDisplay");
    const outfitText = document.getElementById("outfitName");

    function openModal(modelKey, displayName) {
        currentOutfitData = allModels[modelKey];
        document.getElementById("modalTitle").innerText = displayName;
        currentIndex = 0;
        updateDisplay();
        modal.style.display = "block";
    }

    function updateDisplay() {
        outfitImg.src = currentOutfitData[currentIndex].src;
        outfitText.innerText = currentOutfitData[currentIndex].name;
    }

    document.getElementById("nextBtn").onclick = () => {
        currentIndex = (currentIndex + 1) % currentOutfitData.length;
        updateDisplay();
    };

    document.getElementById("prevBtn").onclick = () => {
        currentIndex = (currentIndex - 1 + currentOutfitData.length) % currentOutfitData.length;
        updateDisplay();
    };

    document.querySelector(".close").onclick = () => modal.style.display = "none";
    window.onclick = (event) => { if (event.target == modal) modal.style.display = "none"; }
</script>
</body>
</html>
